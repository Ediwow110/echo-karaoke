name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

# Every `uses:` is pinned to a full commit SHA. A tag can be moved, and a moved
# tag would change what this workflow executes with no diff to review.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  ui:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ui

  database:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0

      - run: npm ci

      - name: Create a Neon branch
        id: branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_SERVICE_DATABASE_URL: ${{ secrets.NEON_SERVICE_DATABASE_URL }}
          NEON_AUTH_DATABASE_URL: ${{ secrets.NEON_AUTH_DATABASE_URL }}
          BRANCH_NAME: ci-db-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/neon-branch.mjs create

      # Call the binary setup-cli installed. `npx supabase` ignores it, downloads
      # the registry's latest (3.1.0), and dies with "No matching Supabase CLI
      # binary package found for linux-x64" before it reaches the database.
      - name: Apply the migration chain
        env:
          NEON_DATABASE_URL: ${{ steps.branch.outputs.neon_database_url }}
        run: supabase db push --db-url "$NEON_DATABASE_URL" --yes

      - name: Require the runtime role
        env:
          DATABASE_URL: ${{ steps.branch.outputs.neon_database_url }}
        run: node scripts/require-runtime-role.mjs

      - name: Run the database suite
        env:
          NEON_DATABASE_URL: ${{ steps.branch.outputs.neon_database_url }}
        run: supabase test db --db-url "$NEON_DATABASE_URL" --yes

      - name: Delete the Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        run: node scripts/neon-branch.mjs delete

  integration:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0

      - run: npm ci

      - name: Create a Neon branch
        id: branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_SERVICE_DATABASE_URL: ${{ secrets.NEON_SERVICE_DATABASE_URL }}
          NEON_AUTH_DATABASE_URL: ${{ secrets.NEON_AUTH_DATABASE_URL }}
          BRANCH_NAME: ci-it-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/neon-branch.mjs create

      # Same reason as the database job: `supabase`, not `npx supabase`.
      - name: Apply the migration chain
        env:
          NEON_DATABASE_URL: ${{ steps.branch.outputs.neon_database_url }}
        run: supabase db push --db-url "$NEON_DATABASE_URL" --yes

      # The branch inherits the parent's encrypted JWKS rows. Removing them
      # lets Better Auth generate a key pair with this run's secret.
      - name: Drop inherited auth keys
        env:
          NEON_DATABASE_URL: ${{ steps.branch.outputs.neon_database_url }}
        run: psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'delete from public.jwks'

      - name: Run the operation integration suite
        env:
          DATABASE_URL: ${{ steps.branch.outputs.database_url }}
          AUTH_DATABASE_URL: ${{ steps.branch.outputs.auth_database_url }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INTEGRATION_TARGET_CONFIRMED: '1'
        run: npm run test:integration

      - name: Delete the Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        run: node scripts/neon-branch.mjs delete
